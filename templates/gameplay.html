<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamQuiz</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <main class="gameplay-wrap container-fluid d-flex flex-column gap-3 px-0">
        <header class="game-hud-top d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-2">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Player avatar" width="48" height="48"
                    class="game-avatar rounded-circle img-fluid">
                <span class="fw-bold">Tom: #2</span>
            </div>
            <span class="game-brand fw-bold mx-auto">FamQuiz</span>
            <div class="game-score bg-white rounded px-4 py-1">Score: 5,000</div>
        </header>

        <section class="game-question d-flex flex-wrap align-items-center gap-3" aria-label="Question">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Question image"
                class="game-qimg img-fluid rounded">
            <h1 class="flex-grow-1 text-center m-0">Question</h1>
        </section>

        <section class="row g-3 mx-0 game-options" aria-label="Answer options">
            <div class="col-12 col-sm-6 col-lg-3 px-0 px-sm-2 ps-lg-0 pe-lg-2">
                <button type="button" class="game-option opt-1 w-100">Option 1</button>
            </div>
            <div class="col-12 col-sm-6 col-lg-3 px-0 px-sm-2 px-lg-2">
                <button type="button" class="game-option opt-2 w-100">Option 2</button>
            </div>
            <div class="col-12 col-sm-6 col-lg-3 px-0 px-sm-2 px-lg-2">
                <button type="button" class="game-option opt-3 w-100">Option 3</button>
            </div>
            <div class="col-12 col-sm-6 col-lg-3 px-0 px-sm-2 pe-lg-0 ps-lg-2">
                <button type="button" class="game-option opt-4 w-100">Option 4</button>
            </div>
        </section>

        <footer class="game-hud-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>Question 1/8</span>
            <div class="d-flex align-items-center gap-3 mx-auto game-powerups" role="group"
                aria-label="Power-ups">
                <button type="button" aria-label="Double points">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 12.2l7.1-.6L12 2z" />
                    </svg>
                </button>
                <button type="button" aria-label="Remove two options">
                    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="3" fill="currentColor" />
                        <text x="12" y="16.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#4aa8ec"
                            font-family="system-ui, sans-serif">123</text>
                    </svg>
                </button>
                <button type="button" aria-label="Calculator">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                        stroke-width="2" aria-hidden="true">
                        <rect x="5" y="2" width="14" height="20" rx="2" />
                        <line x1="8" y1="6" x2="16" y2="6" />
                        <circle cx="9" cy="11" r="1" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="11" r="1" fill="currentColor" stroke="none" />
                        <circle cx="9" cy="15" r="1" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="15" r="1" fill="currentColor" stroke="none" />
                        <circle cx="9" cy="19" r="1" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="19" r="1" fill="currentColor" stroke="none" />
                    </svg>
                </button>
                <button type="button" aria-label="Hint">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                        stroke-width="2" aria-hidden="true">
                        <path d="M9 18h6M10 21h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z" />
                        <circle cx="12" cy="10" r="1.5" fill="currentColor" stroke="none" />
                    </svg>
                </button>
            </div>
            <a href="{{ url_for('homepage') }}" class="game-quit btn btn-danger px-5">Quit</a>
        </footer>
    </main>
</body>

</html>
