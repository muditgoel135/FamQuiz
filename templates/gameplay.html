<!DOCTYPE html>
<html lang="{{ html_lang }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>FamQuiz</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="{{ theme_class }}">
    {% include 'game_notify.html' %}
    <main class="gameplay-wrap container-fluid d-flex flex-column gap-3 px-0">
        <header class="game-hud-top d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-2">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Player avatar" width="48" height="48"
                    class="game-avatar rounded-circle img-fluid">
                <span class="fw-bold">{{ player_name }}: #{{ player_rank }}</span>
            </div>
            <span class="game-brand fw-bold mx-auto">FamQuiz</span>
            <div class="game-score bg-white rounded px-4 py-1" id="game-score">{{ _('Score:') }} {{ player_score }}
            </div>
        </header>

        <section class="game-question d-flex align-items-center justify-content-center gap-3"
            aria-label="{{ _('Question') }}">
            <h1 class="flex-grow-1 text-center m-0" id="game-question-text">{{ _('Loading questions…') }}</h1>
        </section>
        <p id="game-hint" class="text-center fw-bold mb-0" hidden></p>

        <section class="row g-2 g-lg-3 mx-0 game-options" aria-label="{{ _('Answer options') }}">
            <div class="col-6 col-lg-3">
                <button type="button" class="game-option opt-1 w-100" data-index="0" disabled>…</button>
            </div>
            <div class="col-6 col-lg-3">
                <button type="button" class="game-option opt-2 w-100" data-index="1" disabled>…</button>
            </div>
            <div class="col-6 col-lg-3">
                <button type="button" class="game-option opt-3 w-100" data-index="2" disabled>…</button>
            </div>
            <div class="col-6 col-lg-3">
                <button type="button" class="game-option opt-4 w-100" data-index="3" disabled>…</button>
            </div>
        </section>

        <footer class="game-hud-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span id="game-progress">{{ _('Question') }} 1/{{ num_questions }}</span>
            <div class="d-flex align-items-center gap-3 mx-auto game-powerups" role="group"
                aria-label="{{ _('Power-ups') }}">
                <button type="button" aria-label="{{ _('Double points') }}" data-kind="double" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                        <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 12.2l7.1-.6L12 2z" />
                    </svg>
                </button>
                <button type="button" aria-label="{{ _('Remove two options') }}" data-kind="fifty" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="3" fill="currentColor" />
                        <text x="12" y="16.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#4aa8ec"
                            font-family="system-ui, sans-serif">123</text>
                    </svg>
                </button>
                <button type="button" aria-label="{{ _('Calculator') }}" data-kind="calc" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <rect x="5" y="2" width="14" height="20" rx="2" />
                        <line x1="8" y1="6" x2="16" y2="6" />
                        <circle cx="9" cy="11" r="1" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="11" r="1" fill="currentColor" stroke="none" />
                        <circle cx="9" cy="15" r="1" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="15" r="1" fill="currentColor" stroke="none" />
                        <circle cx="9" cy="19" r="1" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="19" r="1" fill="currentColor" stroke="none" />
                    </svg>
                </button>
                <button type="button" aria-label="{{ _('Hint') }}" data-kind="hint" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <path
                            d="M9 18h6M10 21h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z" />
                        <circle cx="12" cy="10" r="1.5" fill="currentColor" stroke="none" />
                    </svg>
                </button>
            </div>
            <button type="button" id="game-quit" class="game-quit btn btn-danger px-5">{{ _('Quit') }}</button>
        </footer>
    </main>
    <script>
        (function () {
            var quitBtn = document.getElementById("game-quit");
            if (!quitBtn) return;
            quitBtn.addEventListener("click", function () {
                quitBtn.disabled = true;
                var headers = {};
                if (window.CSRF_TOKEN) headers["X-CSRFToken"] = window.CSRF_TOKEN;
                fetch("{{ url_for('quiz_quit') }}", { method: "POST", headers: headers })
                    .then(function () {
                        window.location.href = "{{ url_for('homepage') }}";
                    })
                    .catch(function () {
                        window.location.href = "{{ url_for('homepage') }}";
                    });
            });
        })();
    </script>
    <script>
        window.I18N = {
            noQuiz: {{ _('No active quiz. Start a game from the homepage.')|tojson }},
            loadFail: {{ _('Could not load the quiz.')|tojson }},
            submitFail: {{ _('Could not submit the answer.')|tojson }},
            powerFail: {{ _('Power-up failed.')|tojson }},
            finishFail: {{ _('Could not finish the quiz.')|tojson }},
            complete: {{ _('Quiz complete!')|tojson }},
            youScored: {{ _('You scored')|tojson }},
            topWin: {{ _('— top score, you win!')|tojson }},
            best: {{ _('. Best: ')|tojson }},
            done: {{ _('Done!')|tojson }},
            question: {{ _('Question')|tojson }},
            score: {{ _('Score:')|tojson }},
            hintPrefix: {{ _('Hint: the answer starts with')|tojson }},
            requestFail: {{ _('Quiz service failed (')|tojson }}
        };
        window.CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]')?.content || "";
    </script>
    <script>
        (function () {
            var questionEl = document.getElementById("game-question-text");
            var progressEl = document.getElementById("game-progress");
            var scoreEl = document.getElementById("game-score");
            var hintEl = document.getElementById("game-hint");
            var optionBtns = Array.prototype.slice.call(
                document.querySelectorAll(".game-option")
            );
            var powerBtns = Array.prototype.slice.call(
                document.querySelectorAll(".game-powerups button")
            );
            var currentIndex = -1;
            var answering = false;
            var finishedQuiz = false;

            function fmt(n) {
                return Number(n || 0).toLocaleString(document.documentElement.lang || "en-US");
            }

            function handleErrors(res) {
                if (!res.ok) {
                    return res
                        .json()
                        .catch(function () {
                            return {};
                        })
                        .then(function (body) {
                            throw new Error(
                                body.error ||
                                (window.I18N.requestFail + res.status + ").")
                            );
                        });
                }
                return res.json();
            }

            function post(url, body) {
                var headers = { "Content-Type": "application/json" };
                if (window.CSRF_TOKEN) headers["X-CSRFToken"] = window.CSRF_TOKEN;
                return fetch(url, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(body),
                }).then(handleErrors);
            }

            function setOptionsEnabled(enabled) {
                optionBtns.forEach(function (btn) {
                    if (!btn.classList.contains("removed")) {
                        btn.disabled = !enabled;
                    }
                });
            }

            function clearFeedback() {
                optionBtns.forEach(function (btn) {
                    btn.classList.remove("correct", "wrong", "removed");
                });
            }

            function setPowerups(offeredKind) {
                powerBtns.forEach(function (btn) {
                    var available =
                        !!offeredKind && btn.dataset.kind === offeredKind;
                    btn.disabled = !available;
                    btn.classList.toggle("available", available);
                    btn.classList.remove("armed");
                });
            }

            function render(state) {
                currentIndex = state.index;
                questionEl.textContent = state.question;
                hintEl.hidden = true;
                hintEl.textContent = "";
                clearFeedback();
                optionBtns.forEach(function (btn, i) {
                    btn.textContent = state.options[i];
                });
                setOptionsEnabled(true);
                progressEl.textContent =
                    window.I18N.question + " " + (state.index + 1) + "/" + state.total;
                scoreEl.textContent = window.I18N.score + " " + fmt(state.quiz_score);
                setPowerups(state.powerup);
            }

            function showError(message) {
                questionEl.textContent = message;
                hintEl.hidden = true;
                optionBtns.forEach(function (btn) {
                    btn.textContent = "—";
                });
                setOptionsEnabled(false);
                setPowerups(null);
            }

            var hasQuiz = {{ 'true' if has_quiz else 'false' }};
            var statusUrl = "{{ url_for('game_status') }}";
            var joinUrl = "{{ url_for('game_join') }}";
            var generateUrl = "{{ url_for('quiz_generate') }}";

            function gameStrings() {
                return window.I18N_GAME || {};
            }

            function fmtCountdown(ms) {
                var s = Math.max(0, Math.ceil(ms / 1000));
                var m = Math.floor(s / 60);
                var r = s % 60;
                return (m < 10 ? "0" + m : "" + m) + ":" + (r < 10 ? "0" + r : "" + r);
            }

            function staticBoard(questionText, hintText) {
                currentIndex = -1;
                questionEl.textContent = questionText;
                hintEl.hidden = !hintText;
                hintEl.textContent = hintText || "";
                optionBtns.forEach(function (btn) {
                    btn.textContent = "—";
                });
                setOptionsEnabled(false);
                setPowerups(null);
                progressEl.textContent = "Question –/–";
            }

            function showNoQuizStatic() {
                staticBoard(window.I18N.noQuiz, "");
            }

            function showLeft() {
                // Opted out via Quit: never auto-rejoin from here; the
                // banner above offers an explicit Rejoin instead.
                var T = gameStrings();
                staticBoard(
                    T.leftNote || "You left this game",
                    T.waitingTapJoin || "A family game is waiting — tap Join!"
                );
            }

            function showWaitingTick(game) {
                var T = gameStrings();
                var ms = 0;
                if (game && typeof game.starts_at === "number") {
                    ms = Math.max(0, Math.round(game.starts_at * 1000 - Date.now()));
                } else if (game) {
                    ms = Math.max(0, game.starts_in_ms || 0);
                }
                staticBoard(
                    (T.startingIn || "Game starting in") + " " + fmtCountdown(ms),
                    ""
                );
            }

            function joinAndGenerate() {
                post(joinUrl, {}).then(function (body) {
                    var game = (body && body.game) || {};
                    return post(generateUrl, {
                        num_questions: game.num_questions,
                        difficulty: game.difficulty,
                        powerups_enabled: game.powerups_enabled
                    });
                }).then(function () {
                    loadState();
                }).catch(function (err) {
                    var msg = (err && err.message) || "";
                    if (msg.indexOf("hasn't started") !== -1) {
                        // Lost a race with the countdown: go back to waiting.
                        setTimeout(entryLoop, 2000);
                    } else if (msg.indexOf("cooling down") !== -1) {
                        // Rate limiter (1 generate / 10s): back off, then retry.
                        setTimeout(entryLoop, 11000);
                    } else {
                        showError(msg || window.I18N.loadFail);
                    }
                });
            }

            function entryLoop() {
                // Status-first entry: never generate before the lobby is
                // live, never probe quiz state blind (avoids 404 noise),
                // and never auto-rejoin a player who quit.
                if (answering || finishedQuiz || currentIndex >= 0) return;
                fetch(statusUrl, { headers: { "Accept": "application/json" } })
                    .then(handleErrors)
                    .then(function (body) {
                        var game = (body && body.active_game) || null;
                        if (!game) { showNoQuizStatic(); return; }
                        if (game.you_left) { showLeft(); return; }
                        if (game.status !== "active") {
                            showWaitingTick(game);
                            setTimeout(entryLoop, 2000);
                            return;
                        }
                        joinAndGenerate();
                    })
                    .catch(function () {
                        setTimeout(entryLoop, 4000);
                    });
            }

            function loadState() {
                fetch("{{ url_for('quiz_state') }}")
                    .then(handleErrors)
                    .then(render)
                    .catch(function (err) {
                        var msg = (err && err.message) || "";
                        if (msg.indexOf("No active quiz") !== -1 ||
                            msg.indexOf("expired") !== -1) {
                            entryLoop();
                        } else if (msg.indexOf("already finished") !== -1) {
                            // Reload after last answer but before finish:
                            // complete the quiz instead of stranding.
                            finishQuiz();
                        } else {
                            showError(err.message || window.I18N.loadFail);
                        }
                    });
            }

            if (hasQuiz) {
                loadState();
            } else {
                entryLoop();
            }

            function answer(idx) {
                if (answering || finishedQuiz || currentIndex < 0) return;
                answering = true;
                setOptionsEnabled(false);
                post("{{ url_for('quiz_answer') }}", {
                    option_index: idx,
                    question_index: currentIndex,
                })
                    .then(function (res) {
                        optionBtns[res.correct_index].classList.add("correct");
                        if (!res.correct) {
                            optionBtns[idx].classList.add("wrong");
                        }
                        scoreEl.textContent = window.I18N.score + " " + fmt(res.quiz_score);
                        setPowerups(null);
                        setTimeout(function () {
                            answering = false;
                            if (res.finished) {
                                finishQuiz();
                            } else {
                                loadState();
                            }
                        }, 900);
                    })
                    .catch(function (err) {
                        answering = false;
                        var msg = (err && err.message) || "";
                        if (msg.indexOf("expired") !== -1) {
                            // Quiz belongs to an older game: rejoin fresh.
                            currentIndex = -1;
                            entryLoop();
                        } else {
                            showError(msg || window.I18N.submitFail);
                        }
                    });
            }

            function usePowerup(kind, btn) {
                if (!kind || btn.disabled) return;
                post("{{ url_for('quiz_powerup') }}", { kind: kind })
                    .then(function (res) {
                        if (res.kind === "double") {
                            btn.classList.add("armed");
                        }
                        if (res.kind === "fifty" && res.removed) {
                            res.removed.forEach(function (i) {
                                optionBtns[i].classList.add("removed");
                                optionBtns[i].disabled = true;
                            });
                        }
                        if (res.kind === "hint" && res.hint) {
                            hintEl.textContent =
                                window.I18N.hintPrefix + " \u201c" +
                                res.hint +
                                "\u201d";
                            hintEl.hidden = false;
                        }
                        powerBtns.forEach(function (b) {
                            if (b !== btn) {
                                b.disabled = true;
                                b.classList.remove("available");
                            }
                        });
                        btn.disabled = true;
                        btn.classList.remove("available");
                    })
                    .catch(function (err) {
                        showError(err.message || window.I18N.powerFail);
                    });
            }

            function finishQuiz() {
                finishedQuiz = true;
                setOptionsEnabled(false);
                setPowerups(null);
                post("{{ url_for('quiz_finish') }}", {})
                    .then(function (res) {
                        questionEl.textContent = window.I18N.complete;
                        hintEl.textContent =
                            window.I18N.youScored + " " +
                            fmt(res.quiz_score) +
                            " " + "{{ _('points') }}" +
                            (res.is_win
                                ? " " + window.I18N.topWin
                                : window.I18N.best + fmt(res.best_score) + ".");
                        hintEl.hidden = false;
                        progressEl.textContent =
                            window.I18N.done + " " + res.total + "/" + res.total;
                        scoreEl.textContent = window.I18N.score + " " + fmt(res.quiz_score);
                    })
                    .catch(function (err) {
                        showError(err.message || window.I18N.finishFail);
                    });
            }

            optionBtns.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    answer(parseInt(btn.dataset.index, 10));
                });
            });
            powerBtns.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    usePowerup(btn.dataset.kind, btn);
                });
            });
            // Boot is handled above: loadState() with a session quiz,
            // otherwise the status-first entryLoop (no blind 404).
        })();
    </script>
</body>

</html>
