<div id="game-notify" class="game-notify" role="alert" aria-live="polite" hidden
    data-status-url="{{ url_for('game_status') }}"
    data-events-url="{{ url_for('game_events') }}"
    data-join-url="{{ url_for('game_join') }}"
    data-gameplay-url="{{ url_for('gameplay') }}"
    data-authenticated="{{ '1' if current_user.is_authenticated else '0' }}"
    data-reminders="{{ '1' if (current_user.is_authenticated and current_user.game_reminders) else '0' }}"
    data-user-status="{{ current_user.status if current_user.is_authenticated else '' }}">
    <span id="game-notify-dot" class="game-notify-dot" aria-hidden="true"></span>
    <span id="game-notify-text" class="game-notify-text"></span>
    <span id="game-notify-countdown" class="game-notify-countdown" aria-label="countdown"></span>
    <button type="button" id="game-notify-join" class="game-notify-join">{{ _('Join game') }}</button>
    <button type="button" id="game-notify-dismiss" class="game-notify-dismiss" aria-label="{{ _('Dismiss') }}">✕</button>
</div>
<script>
    window.I18N_GAME = {
        startingIn: {{ _('Game starting in')|tojson }},
        waiting: {{ _('Waiting for players…')|tojson }},
        live: {{ _('Game live — opening…')|tojson }},
        cancelled: {{ _('Game cancelled')|tojson }},
        waitingTapJoin: {{ _('A family game is waiting — tap Join!')|tojson }},
        remindersOff: {{ _('Game reminders off — join from homepage')|tojson }},
        dndNote: {{ _('Do not disturb respected')|tojson }},
        join: {{ _('Join game')|tojson }},
        dismiss: {{ _('Dismiss')|tojson }}
    };
</script>
<script src="{{ url_for('static', filename='game_notify.js') }}"></script>
