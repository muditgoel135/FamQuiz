[pytest]
# ``pythonpath`` puts the repo root on sys.path so the ``pytest`` console
# script can ``import app`` (tests/ has no __init__.py, so pytest would
# otherwise only add tests/ to sys.path and every run failed with
# "ModuleNotFoundError: No module named 'app'").
pythonpath = .
testpaths = tests
# "-m 'not live'" keeps a plain ``pytest`` run free of real Ollama/SMTP
# credits. A command-line ``-m live`` overrides it (last -m wins).
addopts = -ra --strict-markers -m "not live"
markers =
    live: tests spending real Ollama/SMTP credits (skipped without creds)
    slow: wall-clock or multi-client tests, run serially last
filterwarnings =
    error::DeprecationWarning:flask_mail.*
    error::DeprecationWarning:flask_security.*
timeout = 120
timeout_method = thread
norecursedirs = build dist .venv instance .git .pytest_cache
python_files = test_*.py
