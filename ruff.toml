# Ruff configuration for FamQuiz.
#
# Install with: pip install ruff
# Run with:     ruff check .
line-length = 90
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "instance"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # Flask route decorators call functions in the default args
    "SIM108", # ternaries are not always clearer
    "UP038",
]

[lint.per-file-ignores]
"tests/*" = ["E731", "E741"]
